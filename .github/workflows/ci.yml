name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET version
        run: dotnet --version

      - name: Restore
        run: dotnet restore FacilityInspection/FacilityInspection.slnx

      - name: Build
        run: >
          dotnet build
          FacilityInspection/FacilityInspection.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          FacilityInspection/FacilityInspection.slnx
          --configuration Release
          --no-build
          --verbosity normal